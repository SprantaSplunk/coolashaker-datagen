#
# Proactive alerts for the lab scenarios (TA-bar-datagen 1.7.0).
# "Early Warning" alerts fire on network leading indicators, "Impact" alerts on business symptoms.
# All stay silent in the healthy baseline. Results go to Activity > Triggered Alerts.
#

[CS - Early Warning - DC Frankfurt path degradation]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = ThousandEyes paths from the plants to the Frankfurt DC show packet loss or latency above baseline. The LLM of the AI Support Bot runs there - predicts slow and unanswered bot conversations.
search = index=demo_thousendeyes thousandeyes.test.type=agent-to-agent thousandeyes.target.agent.location=frankfurt \
| stats avg(metric_name:network.loss) as loss_pct avg(metric_name:network.latency) as latency_s avg(metric_name:network.jitter) as jitter_ms by thousandeyes.test.name \
| where loss_pct > 1 OR jitter_ms > 10
alert.severity = 4

[CS - Early Warning - AI Support Bot prompts unanswered (AI Defense)]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = Cisco AI Defense sees prompts to the AI Support Bot without a response and users repeating their prompts. Guardrail hits stay normal - not a security problem.
search = index=demo_ai_defense sourcetype="cisco:ai:defense" \
| stats count(eval(event_message_type="prompt" AND event_action="Allow")) as prompts count(eval(event_message_type="response")) as responses dc(event_conversation_id) as conversations \
| eval unanswered_pct=round(100 * (prompts - responses) / prompts, 1), prompts_per_conversation=round(prompts / conversations, 2) \
| where unanswered_pct > 5
alert.severity = 4

[CS - Early Warning - WAN path degradation (Berlin)]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = ThousandEyes agent-to-agent paths from/to Berlin show packet loss or jitter above baseline. Predicts Teams, MES and backend issues in Berlin.
search = index=demo_thousendeyes thousandeyes.test.type=agent-to-agent "thousandeyes.test.name"="*Berlin*" NOT "thousandeyes.test.name"="* to Frankfurt" \
| stats avg(metric_name:network.loss) as loss_pct avg(metric_name:network.jitter) as jitter_ms avg(metric_name:network.latency) as latency_s by thousandeyes.test.name \
| where loss_pct > 0.5 OR jitter_ms > 10
alert.severity = 4

[CS - Early Warning - BGP path instability (Atlanta)]
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = ThousandEyes BGP monitor from Atlanta sees reachability loss or path churn (route leak). Predicts SaaS and B2B degradation from Atlanta.
dispatch.earliest_time = -10m
search = index=demo_thousendeyes thousandeyes.test.type=bgp thousandeyes.agent.location=atlanta \
| stats min(metric_name:bgp.reachability) as reachability_pct sum(metric_name:bgp.path_changes.count) as path_changes latest(bgp.as_path) as as_path latest(bgp.prefix) as prefix \
| where reachability_pct < 100 OR path_changes > 30
alert.severity = 4

[CS - Impact - AI inspection fallback to manual sampling]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = Production lines have switched from inline AI vision inspection to manual sampling (throughput down, defect risk up).
search = index=demo_mes production_rate_per_hour=* ai_inspection_mode=fallback_manual \
| stats dc(line_id) as lines avg(ai_inspection_latency_ms) as avg_ai_latency_ms avg(production_rate_per_hour) as units_per_hour by location
alert.severity = 5

[CS - Impact - Berlin backend timeouts (HTTP 504)]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = Tomcat berweb01/02 return HTTP 504 for backend APIs that call the Vienna DC over the SD-WAN.
search = index=demo_tomcat_logs host=berweb* 504 \
| rex field=_raw "\" (?<http_status>\d{3}) " \
| where http_status="504" \
| stats count as timeouts by host \
| where timeouts >= 5
alert.severity = 5

[CS - Impact - B2B order transaction failing (Atlanta)]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = ThousandEyes B2B order transaction from Atlanta completes less than 80 % of its steps.
search = index=demo_thousendeyes thousandeyes.test.type=web-transaction \
| stats avg(metric_name:web.transaction.completion) as completion_pct sum(metric_name:web.transaction.errors.count) as errors by thousandeyes.agent.location \
| where completion_pct < 80
alert.severity = 5

[CS - Impact - Support Hotline queue overloaded]
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
dispatchAs = owner
request.ui_dispatch_app = splunk_app_coolashaker
request.ui_dispatch_view = search
description = Calls pile up in the Teams queue "Support Hotline" because the AI Support Bot hands its conversations over to the agents.
search = index=demo_msteams event_type=call_queue_stats queue_name="Support Hotline" \
| stats max(calls_waiting) as calls_waiting max(longest_wait_seconds) as longest_wait_s sum(bot_handoffs) as bot_handoffs sum(calls_abandoned) as abandoned \
| where calls_waiting > 5
alert.severity = 5
