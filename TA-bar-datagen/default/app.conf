[launcher]
author = Alexander Sötz
version = 1.9.1
description = Demo data generators for Splunk: Buttercup Rocks bar (ITSI), CoolaShaker virtual coffee cup producer, Network Intelligence (Meraki/Catalyst/ThousandEyes/SC4SNMP). Start/stop from the Inputs page; sends via HEC or directly.

[id]
version = 1.9.1
name = TA-bar-datagen

[install]
build = 1793690719
is_configured = true
state = enabled

[package]
