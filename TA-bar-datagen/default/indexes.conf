# Indexes for both generators. Splunk Cloud only allows path, retention and datatype
# settings in app-shipped indexes.conf (maxTotalDataSizeMB from the original was dropped).
# Retention: 30 days – change frozenTimePeriodInSecs in local/ or in the Indexes UI.

[bar_demo]
homePath   = $SPLUNK_DB/bar_demo/db
coldPath   = $SPLUNK_DB/bar_demo/colddb
thawedPath = $SPLUNK_DB/bar_demo/thaweddb
frozenTimePeriodInSecs = 2592000

