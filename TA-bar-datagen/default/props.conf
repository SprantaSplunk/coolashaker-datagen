# Search-time knowledge for the Buttercup Rocks bar datagen
# (sourcetype stanzas do not support wildcards, so every sourcetype is listed)

[bar:pos:transactions]
KV_MODE = json
SHOULD_LINEMERGE = false
FIELDALIAS-pos_id   = transaction_id AS txn_id
FIELDALIAS-pos_term = terminal_id AS pos_terminal
EVAL-revenue_usd    = if(isnull(total_usd), subtotal_usd, total_usd)
EVAL-has_tip        = if(tip_usd > 0, "yes", "no")
LOOKUP-bartender_shift = bartender_shifts bartender OUTPUT shift
REPORT-items        = bar_pos_items

[bar:payment:terminal]
KV_MODE = json
SHOULD_LINEMERGE = false
FIELDALIAS-pay_ok   = result AS payment_result
EVAL-payment_failed = if(result="declined", 1, 0)
EVAL-latency_bucket = case(response_ms < 200,"fast", response_ms < 500,"normal", response_ms < 1000,"slow", true(),"very_slow")

[bar:keg:pressure]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-pressure_status = case(pressure_psi < 8.0, "CRITICAL", pressure_psi < 9.0, "WARNING", pressure_psi > 14.5, "WARNING", true(), "OK")
EVAL-fill_status     = case(fill_level_pct < 10, "CRITICAL", fill_level_pct < 20, "WARNING", true(), "OK")
FIELDALIAS-keg_beer  = beer_type AS product
LOOKUP-keg_label     = keg_tap_labels keg_id OUTPUT tap_label, brewery, style

[bar:temp:sensor]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-temp_status = case(abs(delta_c) > 5.0, "CRITICAL", abs(delta_c) > 3.0, "WARNING", true(), "OK")
EVAL-temp_f      = round((temp_c * 9/5) + 32, 1)

[bar:co2:occupancy]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-co2_status       = case(co2_ppm > 1500, "CRITICAL", co2_ppm > 1000, "WARNING", true(), "OK")
EVAL-occupancy_status = case(occupancy_pct > 100, "CRITICAL", occupancy_pct > 85, "WARNING", true(), "OK")

[bar:queue:sensor]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-wait_status = case(avg_wait_min > 10, "CRITICAL", avg_wait_min > 5, "WARNING", true(), "OK")
EVAL-crowded     = if(occupancy_pct > 85, "yes", "no")

[bar:revenue:events]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-margin_usd_per_unit = if(units_sold > 0, round(margin_usd/units_sold, 2), 0)

[bar:inventory:log]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-stock_status = case(current_level_pct < 10, "CRITICAL", below_reorder="true" OR below_reorder=1, "WARNING", true(), "OK")
FIELDALIAS-item   = name AS product_name

[bar:pos:infrastructure]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-cpu_status  = case(cpu_pct > 85, "CRITICAL", cpu_pct > 70, "WARNING", true(), "OK")
EVAL-db_util_pct = round(db_connections_active/db_connections_max*100, 1)

[bar:bev:infrastructure]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-signal_quality = case(avg_rssi_dbm > -50, "excellent", avg_rssi_dbm > -65, "good", avg_rssi_dbm > -75, "fair", true(), "poor")

[bar:pay:infrastructure]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-cert_status = case(tls_cert_days_left < 7, "CRITICAL", tls_cert_days_left < 30, "WARNING", true(), "OK")
EVAL-latency_ok  = if(api_latency_ms < 500, "yes", "no")

[bar:fac:infrastructure]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-power_status = case(power_draw_kw > 22, "CRITICAL", power_draw_kw > 18, "WARNING", true(), "OK")

[bar:synthetics]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-check_ok      = if(result="success", 1, 0)
EVAL-slo_breach    = if(result="failure", "yes", "no")
FIELDALIAS-syn_app = app AS itsi_service

[bar:quickbooks:daily]
KV_MODE = json
SHOULD_LINEMERGE = false
EVAL-drift_status  = case(abs(reconciliation_drift_usd) > 50, "CRITICAL", abs(reconciliation_drift_usd) > 10, "WARNING", true(), "OK")
EVAL-drift_abs     = abs(reconciliation_drift_usd)
FIELDALIAS-qb_date = report_date AS accounting_date

# =============================================================================
# CoolaShaker (search time)
# Events arrive via HEC as JSON. HEC skips INDEXED_EXTRACTIONS and index-time
# TRANSFORMS, so the generator sets sourcetype/host itself and fields are
# extracted at search time (KV_MODE = json) instead of at index time.
# Note: TA_cisco_catalyst sets KV_MODE = none for cisco:dnac:devicehealth and
# cisco:dnac:securityadvisory (it expects indexed JSON). This app sorts before
# it (ASCII "-" < "_"), so KV_MODE = json below wins.
# =============================================================================
[msteams:json]
KV_MODE = json

[thousendeyes:json]
KV_MODE = json

[catalyst_center:json]
KV_MODE = json

[cisco:dnac:devicehealth]
KV_MODE = json

[cisco:dnac:site:topology]
KV_MODE = json

[cisco:dnac:securityadvisory]
KV_MODE = json

[meraki:json]
KV_MODE = json

[meraki:assurancealerts]
KV_MODE = json

[meraki:organizationsnetworks]
KV_MODE = json

[meraki:organizations]
KV_MODE = json

[meraki:devicesavailabilitieschangehistory]
KV_MODE = json

[meraki:wirelessdevicespacketlossbydevice]
KV_MODE = json

[windows:events:json]
KV_MODE = json

[mssql:json]
KV_MODE = json

[mes:json]
KV_MODE = json

[infra:json]
KV_MODE = json

[cisco:ai:defense]
KV_MODE = json

# SAP ERP PRD and SAP MII (demo_sap)
[sap:erp:performance]
KV_MODE = json

[sap:idoc]
KV_MODE = json

[sap:idoc:status]
KV_MODE = json

[sap:mii:performance]
KV_MODE = json

# Metric data in Direct mode only. HEC sends native metric events with the original
# sourcetypes vmware:metrics:json / webex:windows:metrics:json (those must NOT get
# INDEXED_EXTRACTIONS, or HEC metric events are rejected by the JSON line breaker).
[coolashaker:metrics:direct]
SHOULD_LINEMERGE = false
# timestamp comes from the modular input (event time) – don't parse the raw
DATETIME_CONFIG = NONE
# modular-input events skip INDEXED_EXTRACTIONS, so build the indexed fields
# (metric_name, _value, dimensions) with index-time transforms instead
TRANSFORMS-coolashaker_metrics = coolashaker_metric_dims, coolashaker_metric_value

# Apache Combined Log Format for the Tomcat web01/web02 servers
[tomcat:access]
SHOULD_LINEMERGE = false
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
TIME_PREFIX = \[
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-tomcat_fields = ^(?P<clientip>\S+)\s+\S+\s+\S+\s+\[(?P<request_time>[^\]]+)\]\s+"(?P<http_method>\w+)\s+(?P<uri_path>\S+)\s+HTTP/(?P<http_version>[\d.]+)"\s+(?P<status>\d{3})\s+(?P<bytes>\S+)\s+"(?P<referer>[^"]*)"\s+"(?P<useragent>[^"]*)"
FIELDALIAS-src    = clientip AS src
FIELDALIAS-src_ip = clientip AS src_ip
FIELDALIAS-url    = uri_path AS url
EVAL-status_type  = case(status >= 500, "server_error", status >= 400, "client_error", status >= 300, "redirect", status >= 200, "success", true(), "unknown")
EVAL-is_dos_suspect = if((status=429 OR status=503 OR status=400) AND match(useragent, "masscan|Go-http-client|libwww-perl|-"), "true", "false")

# Network Intelligence datagen: switch syslog and gNMI telemetry (Catalyst index)
[cisco:gnmi]
KV_MODE = json
AUTO_KV_JSON = true

[cisco:ios]
KV_MODE = none
EXTRACT-cs_ios_header = ^\d+: (?<device>[^:\s]+): \w{3}\s+\d+ [\d:.]+ \w+: %(?<facility>[A-Z0-9_]+)-(?<severity>\d)-(?<mnemonic>[A-Z0-9_]+): (?<message_text>.*)$
EXTRACT-cs_ios_cfglog = CFGLOG_LOGGEDCMD: User:(?<user>\S+)\s+logged command:(?<command>.*)$
EXTRACT-cs_ios_cli_audit = CLI_AUDIT: user=(?<user>\S+) line=(?<line>\S+) src=(?<src>\S+) cmd="(?<command>[^"]*)"
EXTRACT-cs_ios_config = CONFIG_I: Configured from (?<config_via>\S+) by (?<user>\S+) on (?<line>\S+) \((?<src>[^)]+)\)
EXTRACT-cs_ios_login = LOGIN_(?:SUCCESS|FAILED): Login \w+ \[user: (?<user>[^\]]+)\] \[Source: (?<src>[^\]]+)\]
EXTRACT-cs_ios_logout = LOGOUT: User (?<user>\S+) has exited tty session \d+\((?<src>[^)]+)\)
EXTRACT-cs_ios_link = (?:LINK|LINEPROTO)-\d-\w+: (?:Line protocol on )?Interface (?<interface>[^,]+), changed state to (?<link_state>.+)$
