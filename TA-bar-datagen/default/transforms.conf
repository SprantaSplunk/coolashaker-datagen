[bar_pos_items]
SOURCE_KEY = _raw
REGEX      = "name"\s*:\s*"(?P<item_name>[^"]+)".*?"category"\s*:\s*"(?P<item_category>[^"]+)".*?"price"\s*:\s*(?P<item_price>[\d.]+)
MV_ADD     = true

[bartender_shifts]
filename = bartender_shifts.csv
case_sensitive_match = false

[keg_tap_labels]
filename = keg_tap_labels.csv
case_sensitive_match = false

# CoolaShaker metrics in Direct mode: {"metric_name":"x","_value":1.2,"location":"vienna",...}
[coolashaker_metric_dims]
REGEX = "([A-Za-z_][\w.]*)":"([^"]*)"
FORMAT = $1::$2
REPEAT_MATCH = true
WRITE_META = true

[coolashaker_metric_value]
REGEX = "_value":(-?[\d.]+(?:[eE][-+]?\d+)?)
FORMAT = _value::$1
WRITE_META = true
