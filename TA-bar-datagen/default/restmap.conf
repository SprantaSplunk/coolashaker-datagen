[admin:TA_bar_datagen_configuration]
match = /
members = TA_bar_datagen_settings

[admin:TA_bar_datagen_inputs]
match = /
members = TA_bar_datagen_bar_datagen, TA_bar_datagen_coolashaker, TA_bar_datagen_ni_datagen

[admin_external:TA_bar_datagen_settings]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA_bar_datagen_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:TA_bar_datagen_bar_datagen]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA_bar_datagen_rh_bar_datagen.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:TA_bar_datagen_coolashaker]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA_bar_datagen_rh_coolashaker.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:TA_bar_datagen_ni_datagen]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA_bar_datagen_rh_ni_datagen.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
