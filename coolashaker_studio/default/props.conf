# Search-time JSON extraction for the TA-bar-datagen sourcetypes (sent via HEC).
# Other apps (Cisco/Meraki TAs, ITSI content packs, network_intelligence) define the
# same sourcetypes with KV_MODE = none; searches in this app use these settings first.
# The Cisco Catalyst sourcetypes get indexed JSON fields from the Catalyst TA's
# INDEXED_EXTRACTIONS, so extracting them again at search time would duplicate every
# value. All other sourcetypes have no indexed fields and need KV_MODE = json.

[windows:events:json]
KV_MODE = json
AUTO_KV_JSON = true
FIELDALIAS-windows:events:json = extracted_EventType ASNEW EventType extracted_host ASNEW host

